<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABDO SACOR LIVE</title><style>body{margin:0;background:#050814;color:#fff;font-family:Arial;padding:10px}h1{text-align:center;color:#00ff88}.box{background:#0e132e;padding:12px;border-radius:12px;text-align:center;max-width:650px;margin:auto;border:1px solid #00ff88}.match{background:#151c3d;margin:12px auto;max-width:650px;padding:15px;border-radius:16px;border:1px solid #ffffff15}.teams{display:flex;justify-content:space-between;align-items:center}.team{text-align:center;width:32%}.team img{width:60px;height:60px;background:#fff;border-radius:50%;padding:4px}.pred{background:#070a1e;border:1px dashed #00ff88;padding:10px;border-radius:10px;text-align:center;margin-top:10px}.winner{color:#00ff88;font-weight:bold}</style></head><body>
<h1>ABDO SACOR ⚽ LIVE</h1>
<div class="box"><div>🔑 a8f55cf685...9929f92 ✅ LIVE</div><div id="status" style="font-size:12px;color:#aaa;margin-top:5px">⏳ كنجيب أقرب المباريات...</div><button onclick="localStorage.clear();location.reload()" style="margin-top:8px;padding:6px 12px;border-radius:6px;border:none;background:#222;color:#fff">🔄 تحديث</button></div>
<div id="app" style="text-align:center;padding:20px">⏳...</div>
<script>
const API_KEY="a8f55cf6850cc98aaaa5e845a9929f92";
async function load(){
 let app=document.getElementById('app'),status=document.getElementById('status');
 try{
  // هادي هي الحيلة: next=20 كتجيب أقرب 20 ماتش جاي
  let res=await fetch("https://v3.football.api-sports.io/fixtures?next=20",{headers:{"x-apisports-key":API_KEY}});
  let data=await res.json();
  console.log(data);
  if(!data.response || data.response.length==0){
    status.innerHTML="⚠️ API رجع خاوي - تسنا 5 دقايق";
    app.innerHTML=JSON.stringify(data).slice(0,300);
    return;
  }
  status.innerHTML="✅ لقينا "+data.response.length+" مباراة حقيقية قادمة";
  app.innerHTML="";
  data.response.forEach(f=>{
     let hp=55+Math.floor(Math.random()*20);
     let gh=Math.floor(Math.random()*2)+1,ga=Math.floor(Math.random()*2);
     let winner=hp>50?f.teams.home.name:f.teams.away.name;
     app.innerHTML+="<div class='match'><div style='font-size:11px;color:#00c3ff'>🏆 "+f.league.name+" | 📅 "+f.fixture.date.slice(0,10)+"</div><div class='teams'><div class='team'><img src='"+f.teams.home.logo+"'><br>"+f.teams.home.name+"</div><div><b>"+(f.goals.home??0)+" - "+(f.goals.away??0)+"</b><br><small>"+f.fixture.status.short+"</small></div><div class='team'><img src='"+f.teams.away.logo+"'><br>"+f.teams.away.name+"</div></div><div class='pred'><div>🤖 توقع: "+gh+" - "+ga+"</div><div class='winner'>الفائز: "+winner+" ("+hp+"%)</div></div></div>";
  });
 }catch(e){document.getElementById('app').innerHTML="خطأ: "+e;}
}
load();
</script></body></html>
