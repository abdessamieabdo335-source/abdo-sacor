<!DOCTYPE html><html dir=rtl><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ABDO LIVE</title><style>body{margin:0;background:#050814;color:#fff;font-family:Arial;padding:8px}h1{text-align:center;color:#00ff88}.b{background:#0e132e;padding:8px;border-radius:8px;text-align:center;max-width:600px;margin:auto}.m{background:#151c3d;margin:8px auto;max-width:600px;padding:10px;border-radius:10px}.t{display:flex;justify-content:space-between;align-items:center}.te{text-align:center;width:33%}.te img{width:40px;height:40px;background:#fff;border-radius:50%}</style><h1>ABDO LIVE</h1><div class=b id=s>⏳ كنجيب ماتشات جايين...</div><div id=a style=text-align:center;padding:10px>⏳</div><script>const K="a8f55cf6850cc98aaaa5e845a9929f92";fetch("https://v3.football.api-sports.io/fixtures?next=20",{headers:{"x-apisports-key":K}}).then(r=>r.json()).then(d=>{let s=document.getElementById('s'),a=document.getElementById('a');if(!d.response.length){s.innerHTML="API خاوي";return}s.innerHTML="✅ لقينا "+d.response.length+" ماتشات جايين";a.innerHTML="";d.response.forEach(f=>{a.innerHTML+=`<div class=m>${f.league.name} | ${f.fixture.date.slice(0,10)}<div class=t><div class=te><img src=${f.teams.home.logo}><br>${f.teams.home.name}</div><div>${f.goals.home??0}-${f.goals.away??0}</div><div class=te><img src=${f.teams.away.logo}><br>${f.teams.away.name}</div></div></div>`})}).catch(e=>{document.getElementById('a').innerHTML=e})</script>
